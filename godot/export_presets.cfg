; Configuración de exportación del juego.
;
; Preset "Web": es el que usa `npm run juego:publicar` (scripts/publicar-juego.sh)
; para generar `public/game/`, que es lo que Railway sirve en producción.
;
; Dos ajustes NO son negociables:
; - `variant/thread_support=false` (sin hilos): con hilos, el navegador exige las
;   cabeceras COOP/COEP (aislamiento de origen cruzado) y la app no las manda
;   (ver `next.config.ts`, que solo pone Cache-Control en /game/*). Con hilos y
;   sin cabeceras, el motor no arranca.
; - `export_path="../public/game/index.html"`: el componente que monta el juego
;   (`components/game/GodotGame.tsx`) carga `/game/index.js` a mano; si el
;   destino cambia, deja de encontrarlo.
;
; Se edita desde el editor (Proyecto → Exportar). Va al repositorio a propósito:
; sin este archivo el comando de publicar falla con "no export preset found".

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; `anclas/` y `referencias/` son las imágenes de REFERENCIA que usa
; tools/generar_estampas.py para mantener el estilo al generar las estampas; el
; juego no las abre nunca (solo las lee el script de Python). Sin este filtro se
; empaquetaban igual y se llevaban 12 MB de la descarga.
exclude_filter="assets/Prologo/anclas/*, assets/Prologo/referencias/*, assets/Prologo/escenas/Copia*"
export_path="../public/game/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
