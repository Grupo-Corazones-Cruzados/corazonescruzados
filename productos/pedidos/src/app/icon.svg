<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Icono de pestaña de «Gestión de Pedidos».

    Cuadrado violeta del grupo (#4B2D8E) con cubiertos en blanco. Mismo criterio que
    el del otro producto: trazo GRUESO (2,6) y glifo grande, porque a 16 px solo se
    reconocen la silueta y el color.

    ⚠️ El violeta es FIJO aunque el negocio tenga su propio color: el navegador
    cachea el icono por origen y es el mismo para todos los negocios. Y es la marca
    del grupo, que debe reconocerse siempre.
  -->
  <rect width="32" height="32" rx="7" fill="#4B2D8E"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- tenedor: mango y dos dientes -->
    <path d="M11 26V16"/>
    <path d="M8 6v6a3 3 0 0 0 6 0V6"/>
    <path d="M11 6v6"/>
    <!-- cuchillo -->
    <path d="M21 26V6c2.6 1.6 3.6 4.4 3.6 7.2 0 2.2-1.2 3.6-3.6 3.8"/>
  </g>
</svg>
