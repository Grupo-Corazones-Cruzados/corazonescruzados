apply plugin: 'com.android.application'

android {
    namespace = "org.grupocc.gccworld"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "2.0"
        // Vosk trae su motor por arquitectura; sin filtro la APK crecería con las de emulador.
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clave de subida a Google Play. Va FUERA del repo (`~/.gradle/gradle.properties`); sin ella
    // la versión de publicación sale sin firmar y Play la rechaza.
    def firmaSubida = project.hasProperty('GCC_WORLD_KEYSTORE')
    // GCC Centralizado no pasa por Play: se firma con la clave de Herramientas, por donde se distribuye.
    def firmaCentralizado = project.hasProperty('GCC_HERRAMIENTAS_KEYSTORE')
    signingConfigs {
        if (firmaSubida) {
            subida {
                storeFile file(GCC_WORLD_KEYSTORE)
                storePassword GCC_WORLD_CLAVE
                keyAlias 'gcc-world'
                keyPassword GCC_WORLD_CLAVE
            }
        }
        if (firmaCentralizado) {
            herramientas {
                storeFile file(GCC_HERRAMIENTAS_KEYSTORE)
                storePassword GCC_HERRAMIENTAS_CLAVE
                keyAlias 'herramientas'
                keyPassword GCC_HERRAMIENTAS_CLAVE
            }
        }
    }
    // GCC World (org.grupocc.gccworld desde 2026-11-12; antes org.grupocc.progreso, app de Play abandonada): la de las tiendas, sin permisos delicados. GCC Centralizado: la de los miembros,
    // con Control Psicosocial y fuera de las tiendas. Ambas salen de este mismo proyecto.
    flavorDimensions = ['app']
    productFlavors {
        progreso {
            dimension 'app'
            applicationId 'org.grupocc.gccworld'
            if (firmaSubida) signingConfig signingConfigs.subida
        }
        centralizado {
            dimension 'app'
            applicationId 'org.grupocc.centralizado'
            if (firmaCentralizado) signingConfig signingConfigs.herramientas
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Las passkeys dentro de la WebView (`MainActivity`).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.credentials:credentials:1.6.0-beta02"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-beta02"
    // El reloj del ticket: la parada sin conexión espera a la red y la revisión periódica.
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Push (Firebase, proyecto grupo-corazones-cruzados; config en google-services.json).
    implementation platform("com.google.firebase:firebase-bom:34.4.0")
    implementation "com.google.firebase:firebase-messaging"
    // Control Psicosocial, solo en GCC Centralizado: ubicación y detección de la frase en el teléfono.
    centralizadoImplementation "com.google.android.gms:play-services-location:21.3.0"
    centralizadoImplementation "com.alphacephei:vosk-android:0.3.47"
    centralizadoImplementation "net.java.dev.jna:jna:5.13.0@aar"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
